<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cloud DevOps Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container py-5">

    <!-- Header -->

    <h1 class="text-center mb-5">
        ☁️ Cloud DevOps Dashboard
    </h1>

    <!-- Top Cards -->

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card bg-secondary text-center shadow">

                <div class="card-body">

                    <h5 class="card-title">Application</h5>

                    <h3 class="text-success" th:text="${status}"></h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-secondary text-center shadow">

                <div class="card-body">

                    <h5 class="card-title">Version</h5>

                    <h3 th:text="${version}"></h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-secondary text-center shadow">

                <div class="card-body">

                    <h5 class="card-title">Environment</h5>

                    <h3 th:text="${environment}"></h3>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card bg-secondary text-center shadow">

                <div class="card-body">

                    <h5 class="card-title">Port</h5>

                    <h3 th:text="${port}"></h3>

                </div>

            </div>

        </div>

    </div>

    <!-- System Information -->

    <div class="card bg-secondary shadow mt-5">

        <div class="card-header">

            <h4>💻 System Information</h4>

        </div>

        <div class="card-body">

            <table class="table table-dark table-striped table-bordered align-middle">

                <tbody>

                <tr>
                    <td><strong>Operating System</strong></td>
                    <td th:text="${os}"></td>
                </tr>

                <tr>
                    <td><strong>Java Version</strong></td>
                    <td th:text="${javaVersion}"></td>
                </tr>

                <tr>
                    <td><strong>Hostname</strong></td>
                    <td th:text="${hostname}"></td>
                </tr>

                <tr>
                    <td><strong>Processors</strong></td>
                    <td th:text="${processors}"></td>
                </tr>

                <tr>
                    <td><strong>Free Memory</strong></td>
                    <td th:text="${freeMemory}"></td>
                </tr>

                <tr>
                    <td><strong>Total Memory</strong></td>
                    <td th:text="${totalMemory}"></td>
                </tr>

                <tr>
                    <td><strong>JVM Uptime</strong></td>
                    <td th:text="${uptime}"></td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- Monitoring -->

    <div class="card bg-secondary shadow mt-4">

        <div class="card-header">

            <h4>📈 Monitoring</h4>

        </div>

        <div class="card-body">

            <a href="/actuator/health"
               class="btn btn-success me-2"
               target="_blank">
                Health
            </a>

            <a href="/actuator/prometheus"
               class="btn btn-primary me-2"
               target="_blank">
                Prometheus Metrics
            </a>

            <a th:href="${grafanaUrl}"
               class="btn btn-warning"
               target="_blank">
                Grafana
        </a>

        </div>

    </div>

    <!-- Footer -->

    <footer class="text-center mt-5 text-secondary">

        <hr>

        <p>
            Powered by Spring Boot • Docker • Terraform • Ansible • AWS
        </p>

    </footer>

</div>

</body>

</html>
