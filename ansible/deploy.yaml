---
- name: confiure devops dashboard
  hosts: web
  become: yes
  tasks:
    - name: update apt cache
      apt:
        update_cache: yes

    - name: install java 17
      apt:
        name: openjdk-17-jdk
        state: present
      
    - name: install git
      apt:
        name: git
        state: present

    - name: install docker
      apt:
        name: docker.io
        state: present

    - name: start docker service
      service:
        name: docker
        state: started
        enabled: yes    
 
    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
