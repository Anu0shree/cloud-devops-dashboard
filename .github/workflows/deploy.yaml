name: Build and Deploy Cloud DevOps Dashboard

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:


      # =========================================
      # Checkout
      # =========================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # =========================================
      # Java
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # =========================================
      # Build
      # =========================================

      - name: Build Spring Boot application
        run: |
          mvn clean package -DskipTests


      # =========================================
      # Docker login
      # =========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # =========================================
      # Docker image
      # =========================================

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/cloud-devops-dashboard:${{ github.sha }} .


      # =========================================
      # Push Docker image
      # =========================================

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/cloud-devops-dashboard:${{ github.sha }}


      # =========================================
      # Deploy to EC2
      # =========================================

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/cloud-devops-dashboard:${{ github.sha }}"


            echo "======================================"

            echo "Deploying Cloud DevOps Dashboard"

            echo "Image: $IMAGE"

            echo "======================================"


            # -----------------------------------
            # Get the REAL EC2 hostname
            # -----------------------------------

            EC2_HOSTNAME=$(hostname)

            echo "EC2 hostname: $EC2_HOSTNAME"


            # -----------------------------------
            # Pull latest image
            # -----------------------------------

            sudo docker pull "$IMAGE"


            # -----------------------------------
            # Remove old container
            # -----------------------------------

            sudo docker rm -f dashboard 2>/dev/null || true


            # -----------------------------------
            # Remove unused Docker resources
            # -----------------------------------

            sudo docker system prune -f


            # -----------------------------------
            # Start new container
            # -----------------------------------

            sudo docker run -d \
              --name dashboard \
              --restart unless-stopped \
              -p 8080:8080 \
              -e APP_HOSTNAME="$EC2_HOSTNAME" \
              -e APP_ENVIRONMENT="AWS EC2" \
              -e GRAFANA_URL="${{ secrets.GRAFANA_URL }}" \
              "$IMAGE"


            # -----------------------------------
            # Wait for application
            # -----------------------------------

            echo "Waiting for application..."

            sleep 10


            # -----------------------------------
            # Show container
            # -----------------------------------

            sudo docker ps


            # -----------------------------------
            # Verify hostname environment variable
            # -----------------------------------

            echo "Container hostname configuration:"

            sudo docker exec dashboard \
              sh -c 'echo APP_HOSTNAME=$APP_HOSTNAME'


            # -----------------------------------
            # Health check
            # -----------------------------------

            echo "Health check:"

            curl --fail \
              http://localhost:8080/actuator/health


            echo ""

            echo "======================================"

            echo "Deployment successful"

            echo "======================================"